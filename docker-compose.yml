services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lungvision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TORCH_DEVICE=auto
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - lungvision-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lungvision-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lungvision-network

networks:
  lungvision-network:
    driver: bridge

